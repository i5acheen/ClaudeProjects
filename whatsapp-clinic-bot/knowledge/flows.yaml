welcome:
  mr: "नमस्कार 🙏 द व्हॅस्कुलर सेंटर, डॉ. अमोल लाहोटी (व्हेरिकोज व्हेन्स स्पेशालिस्ट) यांच्या क्लिनिकमध्ये आपलं स्वागत आहे.\n9+ वर्षांच्या अनुभवात सरांनी 1000+ रुग्णांवर उपचार केले आहेत.\n🆓 पात्र रुग्णांसाठी सरकारी योजनेअंतर्गत मोफत उपचार."
  hi: "नमस्ते 🙏 द वैस्कुलर सेंटर, डॉ. अमोल लाहोटी (वेरिकोज़ वेन्स स्पेशलिस्ट) के क्लिनिक में आपका स्वागत है.\n9+ वर्षों के अनुभव में डॉक्टर साहब ने 1000+ मरीज़ों का इलाज किया है.\n🆓 पात्र मरीज़ों के लिए सरकारी योजना में मुफ़्त इलाज."
  en: "Hello 🙏 Welcome to The Vascular Center, the clinic of Dr. Amol Lahoti (Varicose Veins Specialist).\nIn 9+ years, Dr. Lahoti has treated 1000+ patients.\n🆓 Free treatment for eligible patients under government schemes."

