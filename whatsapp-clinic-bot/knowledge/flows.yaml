# Fixed answers shown for menu items. `next` = buttons shown under the answer (max 3).
answers:
  treatment:
    text:
      mr: "*आधुनिक, कमी त्रासाचे उपचार* 💉\n• लेझर (Endovenous Laser), ग्लू (VenaSeal™) किंवा MOCA\n• छोट्या छिद्रातून, मोठा कट किंवा टाके नाहीत\n• डे-केअर: बहुतेक रुग्ण त्याच दिवशी किंवा दुसऱ्या दिवशी चालत घरी जातात\n• नंतर 3–6 महिने दिवसा स्टॉकिंग्ज\nकोणता उपचार योग्य, हे तपासणी व कलर डॉपलरनंतर ठरते."
      hi: "*आधुनिक, कम तकलीफ़ वाला इलाज* 💉\n• लेज़र (Endovenous Laser), ग्लू (VenaSeal™) या MOCA\n• छोटे से छेद से, बड़ा कट या टांके नहीं\n• डे-केयर: ज़्यादातर मरीज़ उसी दिन या अगले दिन चलकर घर जाते हैं\n• बाद में 3–6 महीने दिन में स्टॉकिंग्स\nकौन सा इलाज सही है, यह जांच और कलर डॉप्लर के बाद तय होता है."
      en: "*Modern, minimally invasive treatment* 💉\n• Endovenous laser, VenaSeal™ glue or MOCA\n• Through a small puncture, with no big cut or stitches\n• Day-care: most patients walk home the same or the next day\n• Compression stockings during the day for 3–6 months\nThe right option is decided after examination and Colour Doppler."
    next: [book, cost, videos]
  cost:
    text:
      mr: "*खर्च व मदत* 💰\n• कन्सल्टेशनमध्ये तपासणी + कलर डॉपलर दोन्ही समाविष्ट\n• लेझर उपचार: अंदाजे ₹60,000 – ₹1,20,000 (हॉस्पिटल, उपचार, भूल व औषधांसह)\n• बहुतेक आरोग्य विमा पॉलिसींमध्ये कव्हर\n• पात्र रुग्णांना सरकारी आरोग्य योजनांसाठी मदत\nअचूक खर्च तपासणीनंतरच सांगता येतो. कन्सल्टेशन फी आमची टीम कॉलवर सांगेल."
      hi: "*खर्च और मदद* 💰\n• कंसल्टेशन में जांच + कलर डॉप्लर दोनों शामिल\n• लेज़र इलाज: लगभग ₹60,000 – ₹1,20,000 (अस्पताल, इलाज, एनेस्थीसिया और दवाइयों सहित)\n• ज़्यादातर हेल्थ इंश्योरेंस में कवर\n• पात्र मरीज़ों को सरकारी स्वास्थ्य योजनाओं में मदद\nसही खर्च जांच के बाद ही बताया जा सकता है. कंसल्टेशन फ़ीस हमारी टीम कॉल पर बताएगी."
      en: "*Cost & support* 💰\n• The consultation includes examination + Colour Doppler\n• Laser treatment: approx. ₹60,000 – ₹1,20,000 (incl. hospital stay, procedure, anaesthesia, medicines)\n• Covered by most health insurance policies\n• Help for eligible patients with government health schemes\nThe exact cost is known only after examination. Our team will share the consultation fee on the call."
    next: [book, call, menu]
  location:
    text:
      mr: "📍 *द व्हॅस्कुलर सेंटर*\nसेंच्युरी मल्टिस्पेशालिटी हॉस्पिटल, मध्यवर्ती बस स्थानकासमोर, हॉटेल अजिंक्यच्या मागे, कोतवालपुरा, छत्रपती संभाजीनगर\n🗺️ https://maps.google.com/?cid=3009403215213270248\n📞 +91 99711 21273 / 0240 247 2281\n🕘 वेळ: आमची टीम कॉलवर सांगेल."
      hi: "📍 *द वैस्कुलर सेंटर*\nसेंचुरी मल्टीस्पेशलिटी हॉस्पिटल, सेंट्रल बस स्टैंड के सामने, होटल अजिंक्य के पीछे, कोतवालपुरा, छत्रपति संभाजीनगर\n🗺️ https://maps.google.com/?cid=3009403215213270248\n📞 +91 99711 21273 / 0240 247 2281\n🕘 समय: हमारी टीम कॉल पर बताएगी."
      en: "📍 *The Vascular Center*\nCentury Multispeciality Hospital, opposite Central Bus Stand, behind Hotel Ajinkya, Kotwalpura, Chhatrapati Sambhajinagar\n🗺️ https://maps.google.com/?cid=3009403215213270248\n📞 +91 99711 21273 / 0240 247 2281\n🕘 Timings: our team will share them on the call."
    next: [book, call, menu]
  doctor:
    text:
      mr: "🩺 *डॉ. अमोल लाहोटी*\nव्हेरिकोज व्हेन्स स्पेशालिस्ट व एंडोव्हॅस्कुलर सर्जन\n• 9+ वर्षांचा अनुभव, 1000+ रुग्णांवर उपचार\n• MBBS (नायर हॉस्पिटल, मुंबई), MD रेडिओलॉजी (नागपूर)\n• व्हॅस्कुलर व इंटरव्हेन्शनल रेडिओलॉजी (सायन हॉस्पिटल, मुंबई)\n• टाटा मेमोरियल हॉस्पिटल येथे केमोएम्बोलायझेशन प्रशिक्षण\n• Google वर 'Excellent' रेटिंग"
      hi: "🩺 *डॉ. अमोल लाहोटी*\nवेरिकोज़ वेन्स स्पेशलिस्ट और एंडोवैस्कुलर सर्जन\n• 9+ वर्षों का अनुभव, 1000+ मरीज़ों का इलाज\n• MBBS (नायर हॉस्पिटल, मुंबई), MD रेडियोलॉजी (नागपुर)\n• वैस्कुलर और इंटरवेंशनल रेडियोलॉजी (सायन हॉस्पिटल, मुंबई)\n• टाटा मेमोरियल हॉस्पिटल में केमोएम्बोलाइज़ेशन ट्रेनिंग\n• Google पर 'Excellent' रेटिंग"
      en: "🩺 *Dr. Amol Lahoti*\nVaricose Veins Specialist & Endovascular Surgeon\n• 9+ years of experience, 1000+ patients treated\n• MBBS (Nair Hospital, Mumbai), MD Radiology (Nagpur)\n• Vascular & Interventional Radiology (Sion Hospital, Mumbai)\n• Chemoembolization training at Tata Memorial Hospital\n• Rated 'Excellent' on Google"
    next: [book, videos, menu]
  videos:
    text:
      mr: "🎥 डॉ. लाहोटी सरांचे पायाच्या नसांच्या त्रासाबद्दल व उपचारांबद्दल व्हिडिओ:\nhttps://www.youtube.com/@healthylegsforhealthylifeb6496\nअधिक माहिती: https://dramollahoti.com"
      hi: "🎥 डॉ. लाहोटी के पैरों की नसों की तकलीफ़ और इलाज पर वीडियो:\nhttps://www.youtube.com/@healthylegsforhealthylifeb6496\nअधिक जानकारी: https://dramollahoti.com"
      en: "🎥 Dr. Lahoti's videos on leg vein problems and their treatment:\nhttps://www.youtube.com/@healthylegsforhealthylifeb6496\nMore information: https://dramollahoti.com"
    next: [book, call, menu]
  other:
    text:
      mr: "नक्की 🙏 तुमचा प्रश्न टाइप करून पाठवा."
      hi: "ज़रूर 🙏 अपना सवाल टाइप करके भेजें."
      en: "Sure 🙏 Please type your question."
    next: []

# Problems shown in the concern list. `label` is what the clinic sees in the lead sheet.
concerns:
  - id: varicose
    label: varicose veins
    title: {mr: "पायावर फुगलेल्या नसा", hi: "पैरों में उभरी नसें", en: "Varicose / bulging veins"}
    info:
      mr: "फुगलेल्या नसांकडे (व्हेरिकोज व्हेन्स) दुर्लक्ष केल्यास सूज, वेदना, त्वचेचा रंग बदलणे असे त्रास वाढू शकतात. वेळीच तपासणी केल्यास गुंतागुंत टाळता येते, आणि आधुनिक डे-केअर लेझर/ग्लू उपचार उपलब्ध आहेत."
      hi: "उभरी नसों (वेरिकोज़ वेन्स) को नज़रअंदाज़ करने से सूजन, दर्द, त्वचा का रंग बदलना जैसी तकलीफ़ें बढ़ सकती हैं. समय पर जांच से जटिलताएं टाली जा सकती हैं, और आधुनिक डे-केयर लेज़र/ग्लू इलाज उपलब्ध है."
      en: "If ignored, varicose veins can lead to more swelling, pain and skin colour changes. Early check-up helps avoid complications, and modern day-care laser/glue treatment is available."
  - id: swelling
    label: leg swelling
    title: {mr: "पायाला सूज", hi: "पैरों में सूजन", en: "Leg swelling"}
    info:
      mr: "पायाची सूज व्हेरिकोज व्हेन्स, DVT किंवा रक्तवाहिन्यांच्या इतर त्रासामुळे असू शकते. तपासणी व कलर डॉपलरने नेमके कारण समजते.\n⚠️ अचानक मोठी सूज, तीव्र वेदना किंवा श्वास घ्यायला त्रास असल्यास लगेच 108 वर कॉल करा."
      hi: "पैरों की सूजन वेरिकोज़ वेन्स, DVT या खून की नसों की किसी और तकलीफ़ से हो सकती है. जांच और कलर डॉप्लर से सही कारण पता चलता है.\n⚠️ अचानक बहुत सूजन, तेज़ दर्द या सांस लेने में तकलीफ़ हो तो तुरंत 108 पर कॉल करें."
      en: "Leg swelling can be due to varicose veins, DVT or other blood vessel problems. Examination and Colour Doppler show the exact cause.\n⚠️ Sudden severe swelling, strong pain or breathlessness: call 108 immediately."
  - id: pain
    label: leg pain
    title: {mr: "पाय दुखणे / जडपणा", hi: "पैर दर्द / भारीपन", en: "Leg pain / heaviness"}
    info:
      mr: "पाय दुखणे, जडपणा किंवा पेटके हे व्हेरिकोज व्हेन्स किंवा रक्तवाहिन्यांच्या त्रासाचे लक्षण असू शकते. क्लिनिकल तपासणी व कलर डॉपलरने कारण समजते."
      hi: "पैर दर्द, भारीपन या ऐंठन वेरिकोज़ वेन्स या खून की नसों की तकलीफ़ का लक्षण हो सकता है. क्लिनिकल जांच और कलर डॉप्लर से कारण पता चलता है."
      en: "Leg pain, heaviness or cramps can be a sign of varicose veins or a blood vessel problem. Clinical examination and Colour Doppler find the cause."
  - id: spider
    label: spider veins
    title: {mr: "बारीक जाळीदार नसा", hi: "बारीक जालीदार नसें", en: "Spider veins"}
    info:
      mr: "बारीक जाळीदार नसा (spider veins) नसांमधील वाढलेल्या दाबाचे लक्षण असू शकतात. तपासणीनंतर योग्य उपाय सुचवले जातात."
      hi: "बारीक जालीदार नसें (spider veins) नसों में बढ़े दबाव का लक्षण हो सकती हैं. जांच के बाद सही उपाय बताया जाता है."
      en: "Spider veins can be a sign of raised pressure in the veins. The right option is suggested after examination."
  - id: ulcer
    label: leg ulcer
    title: {mr: "पायावर न भरणारी जखम", hi: "पैर पर न भरने वाला घाव", en: "Non-healing leg wound"}
    info:
      mr: "न भरणारी जखम नसांच्या आजाराशी संबंधित असू शकते. उपचारासोबत नियमित जखमेची काळजी व जीवनशैलीतील बदल महत्त्वाचे आहेत. लवकर तपासणी करून घ्या."
      hi: "न भरने वाला घाव नसों की बीमारी से जुड़ा हो सकता है. इलाज के साथ नियमित घाव की देखभाल और जीवनशैली में बदलाव ज़रूरी हैं. जल्दी जांच करवाएं."
      en: "A non-healing wound can be linked to vein disease. Along with treatment, regular wound care and lifestyle changes matter. Please get checked early."
  - id: other
    label: other
    title: {mr: "दुसरा त्रास", hi: "कोई और तकलीफ़", en: "Other problem"}

