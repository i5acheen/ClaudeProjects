# Local development / CI stack (`supabase start`). Production is configured in the dashboard (docs/PRODUCTION.md).
project_id = "healthconnectcrm"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
otp_length = 6
otp_expiry = 600
