# Predefined menu, answers and booking questions (Marathi / Hindi / English).
# Edit the text freely. Changes apply on the next message, with no restart needed.
# WhatsApp limits: list item title ≤ 24 characters, description ≤ 72, button title ≤ 20.
# Use ONLY facts from clinic_info.md. Anything not listed in this file goes to the AI.

# Standard template: never mention doctor, hospital, address or phone numbers to patients.
# If they ask, our representative calls them (see answers.location and prompts.no_ai).

welcome:
  mr: "नमस्कार 🙏\nआमच्याकडे *आयुष्मान भारत* / सरकारी योजनेअंतर्गत उपचाराची सुविधा उपलब्ध आहे.\n(हिंदी / English साठी 'Hindi' किंवा 'English' टाइप करा)"
  hi: "नमस्ते 🙏\nहमारे यहां *आयुष्मान भारत* / सरकारी योजना के तहत इलाज की सुविधा उपलब्ध है."
  en: "Hello 🙏\nTreatment under *Ayushman Bharat* / government schemes is available with us."

menu:
  text:
    mr: "आम्ही कशी मदत करू? 👇"
    hi: "हम कैसे मदद करें? 👇"
    en: "How can we help? 👇"
  button: {mr: "पर्याय पहा", hi: "विकल्प देखें", en: "See options"}
  items:
    - id: book
      title: {mr: "📅 अपॉइंटमेंट बुक करा", hi: "📅 अपॉइंटमेंट बुक करें", en: "📅 Book appointment"}
      description: {mr: "फक्त दिवस निवडा", hi: "बस दिन चुनें", en: "Just pick a day"}
    - id: photo
      title: {mr: "📷 फोटो / रिपोर्ट पाठवा", hi: "📷 फ़ोटो / रिपोर्ट भेजें", en: "📷 Send photos / reports"}
      description: {mr: "डॉक्टरांचा सल्ला मिळवा", hi: "डॉक्टर की सलाह पाएं", en: "Get the doctor's advice"}
    - id: callback
      title: {mr: "📞 मला कॉल करा", hi: "📞 मुझे कॉल करें", en: "📞 Call me back"}
    - id: disease
      title: {mr: "🩺 दुसरा त्रास निवडा", hi: "🩺 दूसरी तकलीफ़ चुनें", en: "🩺 Choose another problem"}
    - id: other
      title: {mr: "❓ दुसरा प्रश्न", hi: "❓ दूसरा सवाल", en: "❓ Other question"}

# Fixed answers shown for menu items. `next` = buttons shown under the answer (max 3).
answers:
  photo:
    text:
      mr: "📷 त्रासाचे फोटो किंवा रिपोर्ट (उदा. कलर डॉपलर, सोनोग्राफी, MRI / X-ray) इथेच पाठवा.\nफोटो डॉक्टरांना दाखवून त्यांनी दिलेला सल्ला कळवला जाईल."
      hi: "📷 तकलीफ़ की फ़ोटो या रिपोर्ट (जैसे कलर डॉप्लर, सोनोग्राफी, MRI / X-ray) यहीं भेजें.\nफ़ोटो डॉक्टर को दिखाकर उनकी सलाह बताई जाएगी."
      en: "📷 Send photos or reports (e.g. Colour Doppler, sonography, MRI / X-ray) right here.\nWe'll show them to the doctor and share their advice."
    next: [book, call, menu]
  treatment:
    text:
      mr: "*उपचार* 💉\n• तपासणी + कलर डॉपलर\n• गरज असल्यास डे-केअर लेझर उपचार: छोटे छिद्र, टाके नाहीत\n• बहुतेक रुग्ण त्याच किंवा दुसऱ्या दिवशी घरी जातात\n🆓 पात्र रुग्णांसाठी सरकारी योजनेत मोफत."
      hi: "*इलाज* 💉\n• जांच + कलर डॉप्लर\n• ज़रूरत हो तो डे-केयर लेज़र इलाज: छोटा छेद, टांके नहीं\n• ज़्यादातर मरीज़ उसी या अगले दिन घर जाते हैं\n🆓 पात्र मरीज़ों के लिए सरकारी योजना में मुफ़्त."
      en: "*Treatment* 💉\n• Check-up + Colour Doppler\n• If needed: day-care laser treatment, small puncture, no stitches\n• Most patients go home the same or next day\n🆓 Free for eligible patients under government schemes."
    next: [book, scheme, menu]
  cost:
    text:
      mr: "*खर्च* 💰\n• 🆓 पात्र रुग्णांसाठी सरकारी योजनेत उपचार मोफत\n• बहुतेक आरोग्य विमा पॉलिसींमध्ये कव्हर\n• अचूक खर्च तपासणीनंतर सांगितला जातो"
      hi: "*खर्च* 💰\n• 🆓 पात्र मरीज़ों के लिए सरकारी योजना में इलाज मुफ़्त\n• ज़्यादातर हेल्थ इंश्योरेंस में कवर\n• सही खर्च जांच के बाद बताया जाता है"
      en: "*Cost* 💰\n• 🆓 Free for eligible patients under government schemes\n• Usually covered by health insurance\n• The exact cost is shared after the check-up"
    next: [book, scheme, call]
  location:
    # Asked for address/location/doctor/hospital details: never disclosed in chat.
    text:
      mr: "📞 पत्ता व इतर सर्व माहिती आमचे प्रतिनिधी तुम्हाला कॉल करून सांगतील."
      hi: "📞 पता और बाकी सारी जानकारी हमारे प्रतिनिधि आपको कॉल करके बताएंगे."
      en: "📞 Our representative will call you with the address and all other details."
    next: [call, book, menu]
  scheme:
    # ⚠️ [TO BE CONFIRMED BY CLINIC]: scheme names, which treatments are covered, and documents needed.
    text:
      mr: "🆓 *सरकारी योजनेत मोफत उपचार*\nपात्र रुग्णांसाठी लेझर उपचार, ॲडमिशन व औषधे मोफत होऊ शकतात. योजनेची कागदपत्रे आमची टीम करते.\nतुमच्याकडे आयुष्मान भारत / MJPJAY कार्ड आहे का?"
      hi: "🆓 *सरकारी योजना में मुफ़्त इलाज*\nपात्र मरीज़ों के लिए लेज़र इलाज, भर्ती और दवाइयां मुफ़्त हो सकती हैं. योजना के कागज़ात हमारी टीम करती है.\nक्या आपके पास आयुष्मान भारत / MJPJAY कार्ड है?"
      en: "🆓 *Free treatment under government schemes*\nFor eligible patients, laser treatment, admission and medicines can be free. Our team handles the scheme paperwork.\nDo you have an Ayushman Bharat / MJPJAY card?"
    next: []
  other:
    text:
      mr: "नक्की 🙏 तुमचा प्रश्न टाइप करा."
      hi: "ज़रूर 🙏 अपना सवाल टाइप करें."
      en: "Sure 🙏 Please type your question."
    next: []

# Problems shown in the concern list. `label` is what the clinic sees in the lead sheet.
concerns:
  - id: varicose
    label: varicose veins
    title: {mr: "🦵 व्हेरिकोज व्हेन्स", hi: "🦵 वेरिकोज़ वेन्स", en: "🦵 Varicose veins"}
    description: {mr: "पायावर फुगलेल्या नसा", hi: "पैरों में उभरी नसें", en: "Swollen veins on the legs"}
    info:
      mr: "*महत्त्वपूर्ण माहिती-*\n-----------------------------------\nआमच्या येथे शासनातर्फे प्रायव्हेट हॉस्पिटलमध्ये मोफत *व्हेरिकोज व्हेन्स लेझर ट्रीटमेंट* करून मिळते.\n\nही ट्रीटमेंट आधार कार्ड आणि आयुष्मान कार्ड धारकांना मोफत करून मिळते.\n\nलेझर ट्रीटमेंट ची वैशिष्टे:\n- ही एक ऍडव्हॅन्स ट्रीटमेंट आहे.\n- ट्रीटमेंट फक्त 25 मिनिटात होते.\n- पायाला कुठेही कट किंवा टाका लागत नाही.\n\nपेशंटचा दोन्ही पायाचे फोटो किंवा कलर डॉपलर टेस्टचा फोटो काढून आम्हाला याच नंबर वर पाठवा.\n\nफोटो डॉक्टरांना दाखवून त्यांनी दिलेला सल्ला कळवला जाईल."
      hi: "*महत्वपूर्ण जानकारी-*\n-----------------------------------\nहमारे यहां सरकार की ओर से प्राइवेट हॉस्पिटल में मुफ़्त *वेरिकोज़ वेन्स लेज़र ट्रीटमेंट* करवाया जाता है.\n\nयह ट्रीटमेंट आधार कार्ड और आयुष्मान कार्ड धारकों को मुफ़्त मिलता है.\n\nलेज़र ट्रीटमेंट की खासियतें:\n- यह एक एडवांस ट्रीटमेंट है.\n- ट्रीटमेंट सिर्फ़ 25 मिनट में होता है.\n- पैर पर कहीं भी कट या टांका नहीं लगता.\n\nमरीज़ के दोनों पैरों की फ़ोटो या कलर डॉप्लर टेस्ट की फ़ोटो इसी नंबर पर भेजें.\n\nफ़ोटो डॉक्टर को दिखाकर उनकी सलाह बताई जाएगी."
      en: "*Important information-*\n-----------------------------------\nWe arrange free *varicose vein laser treatment* at a private hospital under a government scheme.\n\nThe treatment is free for Aadhaar card and Ayushman card holders.\n\nAbout the laser treatment:\n- It is an advanced treatment.\n- It takes only 25 minutes.\n- No cut or stitch anywhere on the leg.\n\nPlease send photos of both of the patient's legs, or the Colour Doppler report, to this number.\n\nWe will show the photos to the doctor and share their advice."
  - id: varicocele
    label: varicocele
    title: {mr: "व्हॅरिकोसील", hi: "वैरिकोसील", en: "Varicocele"}
    description: {mr: "अंडकोषात सूज, दुखणे, जडपणा", hi: "अंडकोष में सूजन, दर्द, भारीपन", en: "Swelling, pain or heaviness in the scrotum"}
    info:
      mr: "*व्हॅरिकोसीलचा त्रास आहे का?*\nअंडकोषात सूज, दुखणे किंवा जडपणा जाणवतो का?\n\n✅ योग्य उपचार आणि मार्गदर्शन मिळवा.\n✅ *आयुष्मान भारत* अंतर्गत उपचाराची सुविधा.\n✅ *मोफत सल्ला* (Free Consultancy).\n\nसोनोग्राफी / कलर डॉपलर रिपोर्ट असल्यास त्याचा फोटो इथे पाठवा. डॉक्टरांचा सल्ला कळवला जाईल."
      hi: "*वैरिकोसील की तकलीफ़ है?*\nअंडकोष में सूजन, दर्द या भारीपन महसूस होता है?\n\n✅ सही इलाज और मार्गदर्शन पाएं.\n✅ *आयुष्मान भारत* के तहत इलाज की सुविधा.\n✅ *मुफ़्त सलाह* (Free Consultancy).\n\nसोनोग्राफी / कलर डॉप्लर रिपोर्ट हो तो उसकी फ़ोटो यहां भेजें. डॉक्टर की सलाह बताई जाएगी."
      en: "*Suffering from varicocele?*\nSwelling, pain or heaviness in the scrotum?\n\n✅ Get the right treatment and guidance.\n✅ Treatment available under *Ayushman Bharat*.\n✅ *Free consultation*.\n\nIf you have a sonography / Colour Doppler report, send a photo here for the doctor's advice."
  - id: spine
    label: spine problem
    title: {mr: "🦴 स्पाइन (मणका) त्रास", hi: "🦴 स्पाइन की तकलीफ़", en: "🦴 Spine problem"}
    description: {mr: "कंबरदुखी, मानदुखी, पाठ, साईटिका", hi: "कमर दर्द, गर्दन दर्द, पीठ, साइटिका", en: "Back, neck pain, sciatica"}
    info:
      mr: "*स्पाइनच्या आजाराने त्रस्त आहात?*\nआता *संभाजीनगर* येथे योग्य उपचार सुविधा उपलब्ध!\n\n✔️ कंबरदुखी\n✔️ मानदुखी\n✔️ पाठीचा त्रास\n✔️ स्नायूंच्या वेदना\n✔️ साईटिका वेदना\n\n✅ *आयुष्मान कार्ड* द्वारे कॅशलेस उपचार उपलब्ध!\n\nMRI / X-ray रिपोर्ट असल्यास त्याचा फोटो इथे पाठवा. डॉक्टरांचा सल्ला कळवला जाईल."
      hi: "*स्पाइन की बीमारी से परेशान हैं?*\nअब *संभाजीनगर* में सही इलाज की सुविधा उपलब्ध!\n\n✔️ कमर दर्द\n✔️ गर्दन दर्द\n✔️ पीठ की तकलीफ़\n✔️ मांसपेशियों का दर्द\n✔️ साइटिका का दर्द\n\n✅ *आयुष्मान कार्ड* से कैशलेस इलाज उपलब्ध!\n\nMRI / X-ray रिपोर्ट हो तो उसकी फ़ोटो यहां भेजें. डॉक्टर की सलाह बताई जाएगी."
      en: "*Troubled by a spine problem?*\nProper treatment is now available in *Sambhajinagar*!\n\n✔️ Lower back pain\n✔️ Neck pain\n✔️ Back problems\n✔️ Muscle pain\n✔️ Sciatica pain\n\n✅ Cashless treatment with the *Ayushman card*!\n\nIf you have an MRI / X-ray report, send a photo here for the doctor's advice."
  - id: other
    label: other
    title: {mr: "❓ इतर त्रास", hi: "❓ कोई और तकलीफ़", en: "❓ Other problem"}

durations:
  - {id: lt6m, label: "less than 6 months", title: {mr: "6 महिन्यांपेक्षा कमी", hi: "6 महीने से कम", en: "Under 6 months"}}
  - {id: 6m2y, label: "6 months - 2 years", title: {mr: "6 महिने – 2 वर्षे", hi: "6 महीने – 2 साल", en: "6 months – 2 years"}}
  - {id: gt2y, label: "more than 2 years", title: {mr: "2 वर्षांपेक्षा जास्त", hi: "2 साल से ज़्यादा", en: "Over 2 years"}}

times:
  - {id: today, label: "today", title: {mr: "आज", hi: "आज", en: "Today"}}
  - {id: tom_am, label: "tomorrow morning", title: {mr: "उद्या सकाळी", hi: "कल सुबह", en: "Tomorrow morning"}}
  - {id: tom_pm, label: "tomorrow evening", title: {mr: "उद्या संध्याकाळी", hi: "कल शाम", en: "Tomorrow evening"}}
  - {id: week, label: "this week", title: {mr: "या आठवड्यात", hi: "इस हफ़्ते", en: "This week"}}
  - {id: weekend, label: "weekend", title: {mr: "शनिवार / रविवार", hi: "शनिवार / रविवार", en: "Weekend"}}
  - {id: call_first, label: "call me first", title: {mr: "आधी कॉल करा", hi: "पहले कॉल करें", en: "Call me first"}}

# Appointment slots. ⚠️ [TO BE CONFIRMED BY CLINIC]: replace these example hours with the real OPD timings.
# If GOOGLE_CALENDAR_ID is set, busy times in that calendar are hidden and requests are added as tentative events.
schedule:
  timezone: Asia/Kolkata
  days_ahead: 7              # how many days ahead patients can choose
  open_days: [mon, tue, wed, thu, fri, sat]
  closed_dates: []           # e.g. ["2026-10-20", "2026-11-01"] for holidays
  slot_minutes: 30
  min_notice_minutes: 120    # earliest slot is at least 2 hours from now
  sessions:
    - id: am
      start: "10:00"
      end: "13:00"
      title: {mr: "🌅 सकाळ", hi: "🌅 सुबह", en: "🌅 Morning"}
    - id: pm
      start: "17:00"
      end: "20:00"
      title: {mr: "🌆 संध्याकाळ", hi: "🌆 शाम", en: "🌆 Evening"}

# Booking questions, asked one at a time (skipped if already known).
prompts:
  concern: {mr: "तुम्हाला पायाचा कोणता त्रास होत आहे? 👇", hi: "आपको पैर में कौन सी तकलीफ़ है? 👇", en: "What problem are you facing? 👇"}
  concern_text: {mr: "थोडक्यात त्रास टाइप करा.", hi: "तकलीफ़ थोड़े में टाइप करें.", en: "Please type the problem in a few words."}
  which_disease: {mr: "तुम्हाला यापैकी कोणता त्रास आहे? 👇", hi: "आपको इनमें से कौन सी तकलीफ़ है? 👇", en: "Which of these problems do you have? 👇"}
  concern_noted: {mr: "धन्यवाद 🙏 तुमचा त्रास नोंदवला आहे. आमचे प्रतिनिधी तुम्हाला कॉल करून माहिती देतील.", hi: "धन्यवाद 🙏 आपकी तकलीफ़ दर्ज कर ली गई है. हमारे प्रतिनिधि आपको कॉल करके जानकारी देंगे.", en: "Thank you 🙏 Your problem is noted. Our representative will call you with details."}
  duration: {mr: "हा त्रास किती काळापासून आहे?", hi: "यह तकलीफ़ कब से है?", en: "How long have you had this?"}
  name: {mr: "अपॉइंटमेंटसाठी कृपया रुग्णाचे *नाव* टाइप करा.", hi: "अपॉइंटमेंट के लिए कृपया मरीज़ का *नाम* टाइप करें.", en: "For the appointment, please type the patient's *name*."}
  city: {mr: "तुम्ही कोणत्या शहरातून / भागातून आहात?", hi: "आप किस शहर / इलाके से हैं?", en: "Which city / area are you from?"}
  preferred_time: {mr: "तुम्हाला कोणती वेळ सोयीची आहे? 👇", hi: "आपके लिए कौन सा समय सही रहेगा? 👇", en: "Which time suits you? 👇"}
  list_button: {mr: "निवडा", hi: "चुनें", en: "Choose"}
  date: {mr: "📅 अपॉइंटमेंटसाठी दिवस निवडा 👇", hi: "📅 अपॉइंटमेंट के लिए दिन चुनें 👇", en: "📅 Pick a day for the appointment 👇"}
  date_button: {mr: "दिवस निवडा", hi: "दिन चुनें", en: "Choose day"}
  call_first: {mr: "📞 आधी कॉल करा", hi: "📞 पहले कॉल करें", en: "📞 Call me first"}
