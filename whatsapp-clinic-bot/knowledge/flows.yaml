  hi: "नमस्ते 🙏 हमारे वेरिकोज़ वेन्स (पैरों की नसें) क्लिनिक में आपका स्वागत है.\n🆓 पात्र मरीज़ों के लिए सरकारी योजना में मुफ़्त इलाज."
  en: "Hello 🙏 Welcome to our varicose veins (leg veins) clinic.\n🆓 Free treatment for eligible patients under government schemes."

