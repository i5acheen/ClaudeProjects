    hi: "हम आपकी कैसे मदद कर सकते हैं? 👇\nविकल्प चुनें या अपना सवाल टाइप करें."
    en: "How can we help you? 👇\nChoose an option or type your question."
  button: {mr: "पर्याय पहा", hi: "विकल्प देखें", en: "See options"}
  items:
    - id: book
      title: {mr: "📅 अपॉइंटमेंट बुक करा", hi: "📅 अपॉइंटमेंट बुक करें", en: "📅 Book appointment"}
      description: {mr: "तपासणीसाठी वेळ ठरवा", hi: "जांच के लिए समय तय करें", en: "Fix a time for a consultation"}
    - id: problem
      title: {mr: "🦵 माझा पायाचा त्रास", hi: "🦵 मेरी पैर की तकलीफ", en: "🦵 My leg problem"}
      description: {mr: "फुगलेल्या नसा, सूज, वेदना, जखम…", hi: "उभरी नसें, सूजन, दर्द, घाव…", en: "Bulging veins, swelling, pain, wounds…"}
    - id: treatment
      title: {mr: "💉 उपचार कसे होतात", hi: "💉 इलाज कैसे होता है", en: "💉 How treatment works"}
      description: {mr: "लेझर / ग्लू, डे-केअर, टाके नाहीत", hi: "लेज़र / ग्लू, डे-केयर, टांके नहीं", en: "Laser / glue, day-care, no stitches"}
    - id: cost
      title: {mr: "💰 खर्च, विमा व योजना", hi: "💰 खर्च, बीमा व योजना", en: "💰 Cost & insurance"}
      description: {mr: "विमा व सरकारी योजनांसाठी मदत", hi: "बीमा और सरकारी योजना में मदद", en: "Insurance and government scheme help"}
    - id: location
      title: {mr: "📍 पत्ता व संपर्क", hi: "📍 पता और संपर्क", en: "📍 Location & contact"}
      description: {mr: "Google Maps लिंक व फोन नंबर", hi: "Google Maps लिंक और फ़ोन नंबर", en: "Google Maps link and phone number"}
    - id: doctor
      title: {mr: "🩺 डॉ. लाहोटींबद्दल", hi: "🩺 डॉ. लाहोटी के बारे में", en: "🩺 About Dr. Lahoti"}
      description: {mr: "अनुभव व शिक्षण", hi: "अनुभव और शिक्षा", en: "Experience and qualifications"}
