  slot_button: {mr: "वेळ निवडा", hi: "समय चुनें", en: "Choose time"}
  no_slots: {mr: "क्षमस्व, पुढील काही दिवसांत ऑनलाइन वेळ उपलब्ध नाही. आमची टीम तुम्हाला कॉल करून वेळ ठरवेल.", hi: "क्षमा करें, अगले कुछ दिनों में ऑनलाइन समय उपलब्ध नहीं है. हमारी टीम आपको कॉल करके समय तय करेगी.", en: "Sorry, no online slots are free in the next few days. Our team will call you to fix a time."}
  slot_taken: {mr: "क्षमस्व, ही वेळ नुकतीच बुक झाली. कृपया दुसरी वेळ निवडा.", hi: "क्षमा करें, यह समय अभी बुक हो गया. कृपया दूसरा समय चुनें.", en: "Sorry, that time was just taken. Please choose another."}
  requested: {mr: "📅 {slot} साठी तुमची विनंती क्लिनिकच्या कॅलेंडरमध्ये नोंदवली आहे.", hi: "📅 {slot} के लिए आपका अनुरोध क्लिनिक के कैलेंडर में दर्ज कर लिया गया है.", en: "📅 Your request for {slot} has been added to the clinic's calendar."}
  confirm_title: {mr: "कृपया तपशील तपासा ✅", hi: "कृपया जानकारी जांच लें ✅", en: "Please check the details ✅"}
  confirm_question: {mr: "हे बरोबर आहे का?", hi: "क्या यह सही है?", en: "Is this correct?"}
  fields:
    name: {mr: "नाव", hi: "नाम", en: "Name"}
    city: {mr: "शहर", hi: "शहर", en: "City"}
    concern: {mr: "त्रास", hi: "तकलीफ़", en: "Problem"}
    duration: {mr: "कालावधी", hi: "अवधि", en: "Since"}
    preferred_time: {mr: "सोयीची वेळ", hi: "सही समय", en: "Preferred time"}
  done: {mr: "धन्यवाद, {name}! 🙏\nआमची क्लिनिक टीम लवकरच तुम्हाला कॉल करून अपॉइंटमेंट निश्चित करेल.", hi: "धन्यवाद, {name}! 🙏\nहमारी क्लिनिक टीम जल्द ही आपको कॉल करके अपॉइंटमेंट पक्की करेगी.", en: "Thank you, {name}! 🙏\nOur clinic team will call you soon to confirm the appointment."}
  done_next: [menu]
  # Appointment = pick a day only. Then the team calls to fix the exact time.
  booked: {mr: "धन्यवाद 🙏 *{day}* साठी तुमची अपॉइंटमेंट विनंती नोंदवली आहे.\nआमचे प्रतिनिधी तुम्हाला कॉल करून वेळ निश्चित करतील.", hi: "धन्यवाद 🙏 *{day}* के लिए आपका अपॉइंटमेंट अनुरोध दर्ज हो गया है.\nहमारे प्रतिनिधि आपको कॉल करके समय तय करेंगे.", en: "Thank you 🙏 Your appointment request for *{day}* is noted.\nOur representative will call you to fix the time."}
  booked_call_first: {mr: "धन्यवाद 🙏 आमचे प्रतिनिधी तुम्हाला लवकरच कॉल करून अपॉइंटमेंट ठरवतील.", hi: "धन्यवाद 🙏 हमारे प्रतिनिधि जल्द ही आपको कॉल करके अपॉइंटमेंट तय करेंगे.", en: "Thank you 🙏 Our representative will call you soon to fix the appointment."}
  callback_done: {mr: "ठीक आहे 🙏 आमचे प्रतिनिधी तुम्हाला लवकरच कॉल करतील.", hi: "ठीक है 🙏 हमारे प्रतिनिधि जल्द ही आपको कॉल करेंगे.", en: "Okay 🙏 Our representative will call you soon."}
  photo_received: {mr: "धन्यवाद 🙏 फोटो / रिपोर्ट मिळाला. डॉक्टरांना दाखवून त्यांनी दिलेला सल्ला तुम्हाला कळवला जाईल.", hi: "धन्यवाद 🙏 फ़ोटो / रिपोर्ट मिल गई. डॉक्टर को दिखाकर उनकी सलाह आपको बताई जाएगी.", en: "Thank you 🙏 Photo / report received. We'll show it to the doctor and share their advice with you."}
  # ⚠️ [TO BE CONFIRMED BY CLINIC]: documents patients should bring for the scheme.
  scheme_card: {mr: "छान! 👍 तपासणीला येताना योजनेचे कार्ड, आधार कार्ड व रेशन कार्ड सोबत आणा. आमची टीम योजनेची प्रक्रिया पूर्ण करण्यास मदत करेल.", hi: "बढ़िया! 👍 जांच के लिए आते समय योजना का कार्ड, आधार कार्ड और राशन कार्ड साथ लाएं. हमारी टीम योजना की प्रक्रिया में मदद करेगी.", en: "Great! 👍 Please bring your scheme card, Aadhaar card and ration card to the consultation. Our team will help complete the scheme process."}
  scheme_unknown: {mr: "काही हरकत नाही 🙏 आमची टीम तुमची पात्रता तपासेल. तपासणीला येताना आधार कार्ड व रेशन कार्ड सोबत आणा.", hi: "कोई बात नहीं 🙏 हमारी टीम आपकी पात्रता जांचेगी. जांच के लिए आते समय आधार कार्ड और राशन कार्ड साथ लाएं.", en: "No problem 🙏 Our team will check your eligibility. Please bring your Aadhaar card and ration card to the consultation."}
  # Used when no AI key is set: typed questions get this + the main menu.
  no_ai: {mr: "तुमचा प्रश्न नोंदवला आहे 🙏 आमचे प्रतिनिधी तुम्हाला कॉल करून माहिती देतील.\nतोपर्यंत खालील मेनूमधून पर्याय निवडू शकता.", hi: "आपका सवाल दर्ज कर लिया गया है 🙏 हमारे प्रतिनिधि आपको कॉल करके जानकारी देंगे.\nतब तक नीचे मेनू से विकल्प चुन सकते हैं.", en: "Your question has been noted 🙏 Our representative will call you with the details.\nMeanwhile, you can choose from the menu below."}
  change: {mr: "ठीक आहे, तपशील पुन्हा भरूया.", hi: "ठीक है, जानकारी फिर से भरते हैं.", en: "Okay, let's fill in the details again."}

# Small buttons used under answers.
buttons:
  book: {mr: "📅 अपॉइंटमेंट", hi: "📅 अपॉइंटमेंट", en: "📅 Book"}
  call: {mr: "📞 कॉल हवा", hi: "📞 कॉल करें", en: "📞 Call me"}
  cost: {mr: "💰 खर्च", hi: "💰 खर्च", en: "💰 Cost"}
  menu: {mr: "☰ मेनू", hi: "☰ मेनू", en: "☰ Menu"}
  scheme: {mr: "🆓 मोफत योजना", hi: "🆓 मुफ़्त योजना", en: "🆓 Free scheme"}
  scheme_card: {mr: "✅ कार्ड आहे", hi: "✅ कार्ड है", en: "✅ I have a card"}
  scheme_unknown: {mr: "❓ माहित नाही", hi: "❓ पता नहीं", en: "❓ Not sure"}
  confirm_yes: {mr: "✅ बरोबर आहे", hi: "✅ सही है", en: "✅ Correct"}
  confirm_change: {mr: "✏️ बदला", hi: "✏️ बदलें", en: "✏️ Change"}

# Gentle reminders if a patient stops replying (sent only inside WhatsApp's free 24-hour window,
# never after the patient confirmed a booking, and never while staff are chatting).
# Keep them honest: no invented deadlines or scarcity.
followups:
  - after_hours: 2
    text:
      mr: "नमस्कार{name} 🙏 तुमच्या त्रासाचे फोटो किंवा रिपोर्ट पाठवायचा असेल तर इथेच पाठवा. डॉक्टरांचा सल्ला कळवला जाईल.\nकिंवा अपॉइंटमेंटसाठी फक्त दिवस निवडा."
      hi: "नमस्ते{name} 🙏 तकलीफ़ की फ़ोटो या रिपोर्ट भेजनी हो तो यहीं भेजें. डॉक्टर की सलाह बताई जाएगी.\nया अपॉइंटमेंट के लिए बस दिन चुनें."
      en: "Hello{name} 🙏 You can send photos or reports of your problem right here for the doctor's advice.\nOr just pick a day for the appointment."
    buttons: [book, call, menu]
  - after_hours: 20
    text:
      mr: "{name_comma}त्रासाकडे दुर्लक्ष केल्यास तो वाढू शकतो. आयुष्मान भारत / सरकारी योजनेअंतर्गत उपचाराची सुविधा उपलब्ध आहे. 🙏\nअपॉइंटमेंटसाठी दिवस निवडायचा का?"
      hi: "{name_comma}तकलीफ़ को नज़रअंदाज़ करने से वह बढ़ सकती है. आयुष्मान भारत / सरकारी योजना के तहत इलाज की सुविधा उपलब्ध है. 🙏\nअपॉइंटमेंट के लिए दिन चुनें?"
      en: "{name_comma}Problems can get worse if ignored. Treatment under Ayushman Bharat / government schemes is available. 🙏\nShall we pick a day for the appointment?"
    buttons: [book, call, menu]

# Adding other treatments later (e.g. piles, heart): add their problems to `concerns`, their facts to
# knowledge/clinic_info.md, a menu item, and whether the scheme covers them.
# Only add once the clinic confirms the treatment and scheme coverage.

# Emergency words: checked on every typed message, with or without AI. The reply goes out instantly.
emergency:
  keywords: ["श्वास घ्यायला", "श्वास लाग", "दम लाग", "छातीत दुख", "छातीत", "सांस लेने", "सांस फूल", "छाती में दर्द",
             "chest pain", "breathless", "can't breathe", "cant breathe", "shwas", "swas ghyayla", "saans",
             "बेशुद्ध", "बेहोश", "behosh", "beshuddh", "unconscious", "fainted", "रक्तस्त्राव", "खूप रक्त",
             "खून बह", "heavy bleeding", "bleeding", "khoon", "लकवा", "पक्षाघात", "paralysis", "stroke",
             "पाय काळा", "पाय निळा", "पैर काला", "पैर नीला", "foot black", "foot blue"]
  text:
    mr: "⚠️ हे गंभीर असू शकते. कृपया *लगेच 108 वर कॉल करा* किंवा जवळच्या हॉस्पिटलच्या इमर्जन्सी विभागात जा. उशीर करू नका."
    hi: "⚠️ यह गंभीर हो सकता है. कृपया *तुरंत 108 पर कॉल करें* या नज़दीकी अस्पताल के इमरजेंसी विभाग में जाएं. देर न करें."
    en: "⚠️ This could be serious. Please *call 108 immediately* or go to the nearest hospital emergency department. Don't wait."
