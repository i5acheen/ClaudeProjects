# Fixed answers shown for menu items. `next` = buttons shown under the answer (max 3).
answers:
  treatment:
    text:
      mr: "*आधुनिक, कमी त्रासाचे उपचार* 💉\n• लेझर (Endovenous Laser), ग्लू (VenaSeal™) किंवा MOCA\n• छोट्या छिद्रातून, मोठा कट किंवा टाके नाहीत\n• डे-केअर: बहुतेक रुग्ण त्याच दिवशी किंवा दुसऱ्या दिवशी चालत घरी जातात\n• नंतर 3–6 महिने दिवसा स्टॉकिंग्ज\n🆓 पात्र रुग्णांसाठी हे ऑपरेशन सरकारी योजनेअंतर्गत मोफत होऊ शकते.\nकोणता उपचार योग्य, हे तपासणी व कलर डॉपलरनंतर ठरते."
      hi: "*आधुनिक, कम तकलीफ़ वाला इलाज* 💉\n• लेज़र (Endovenous Laser), ग्लू (VenaSeal™) या MOCA\n• छोटे से छेद से, बड़ा कट या टांके नहीं\n• डे-केयर: ज़्यादातर मरीज़ उसी दिन या अगले दिन चलकर घर जाते हैं\n• बाद में 3–6 महीने दिन में स्टॉकिंग्स\n🆓 पात्र मरीज़ों के लिए यह ऑपरेशन सरकारी योजना में मुफ़्त हो सकता है.\nकौन सा इलाज सही है, यह जांच और कलर डॉप्लर के बाद तय होता है."
      en: "*Modern, minimally invasive treatment* 💉\n• Endovenous laser, VenaSeal™ glue or MOCA\n• Through a small puncture, with no big cut or stitches\n• Day-care: most patients walk home the same or the next day\n• Compression stockings during the day for 3–6 months\n🆓 For eligible patients, this procedure can be free under government schemes.\nThe right option is decided after examination and Colour Doppler."
    next: [book, scheme, videos]
  cost:
    text:
      mr: "*खर्च व मदत* 💰\n• कन्सल्टेशनमध्ये तपासणी + कलर डॉपलर दोन्ही समाविष्ट\n• लेझर उपचार: अंदाजे ₹60,000 – ₹1,20,000 (हॉस्पिटल, उपचार, भूल व औषधांसह)\n• बहुतेक आरोग्य विमा पॉलिसींमध्ये कव्हर\n• पात्र रुग्णांना सरकारी आरोग्य योजनांसाठी मदत\nअचूक खर्च तपासणीनंतरच सांगता येतो. कन्सल्टेशन फी आमची टीम कॉलवर सांगेल."
      hi: "*खर्च और मदद* 💰\n• कंसल्टेशन में जांच + कलर डॉप्लर दोनों शामिल\n• लेज़र इलाज: लगभग ₹60,000 – ₹1,20,000 (अस्पताल, इलाज, एनेस्थीसिया और दवाइयों सहित)\n• ज़्यादातर हेल्थ इंश्योरेंस में कवर\n• पात्र मरीज़ों को सरकारी स्वास्थ्य योजनाओं में मदद\nसही खर्च जांच के बाद ही बताया जा सकता है. कंसल्टेशन फ़ीस हमारी टीम कॉल पर बताएगी."
      en: "*Cost & support* 💰\n• The consultation includes examination + Colour Doppler\n• Laser treatment: approx. ₹60,000 – ₹1,20,000 (incl. hospital stay, procedure, anaesthesia, medicines)\n• Covered by most health insurance policies\n• Help for eligible patients with government health schemes\nThe exact cost is known only after examination. Our team will share the consultation fee on the call."
    next: [book, call, menu]
  location:
    text:
      mr: "📍 *द व्हॅस्कुलर सेंटर*\nसेंच्युरी हॉस्पिटल, सेंट्रल बस स्टँडच्या समोर, हॉटेल अजिंक्यच्या मागे, कोतवालपुरा, छत्रपती संभाजीनगर\n🗺️ https://maps.google.com/?cid=17175394663658005878\n📞 +91 96995 59301 / +91 88057 89301\n🕘 वेळ: आमची टीम कॉलवर सांगेल."
      hi: "📍 *द वैस्कुलर सेंटर*\nसेंचुरी हॉस्पिटल, सेंट्रल बस स्टैंड के सामने, होटल अजिंक्य के पीछे, कोतवालपुरा, छत्रपति संभाजीनगर\n🗺️ https://maps.google.com/?cid=17175394663658005878\n📞 +91 96995 59301 / +91 88057 89301\n🕘 समय: हमारी टीम कॉल पर बताएगी."
      en: "📍 *The Vascular Center*\nCentury Hospital, opposite Central Bus Stand, behind Hotel Ajinkya, Kotwalpura, Chhatrapati Sambhajinagar\n🗺️ https://maps.google.com/?cid=17175394663658005878\n📞 +91 96995 59301 / +91 88057 89301\n🕘 Timings: our team will share them on the call."
    next: [book, call, menu]
  doctor:
    text:
      mr: "🩺 *डॉ. अमोल लाहोटी*\nव्हेरिकोज व्हेन्स स्पेशालिस्ट व एंडोव्हॅस्कुलर सर्जन\n• 9+ वर्षांचा अनुभव, 1000+ रुग्णांवर उपचार\n• MBBS (नायर हॉस्पिटल, मुंबई), MD रेडिओलॉजी (नागपूर)\n• व्हॅस्कुलर व इंटरव्हेन्शनल रेडिओलॉजी (सायन हॉस्पिटल, मुंबई)\n• टाटा मेमोरियल हॉस्पिटल येथे केमोएम्बोलायझेशन प्रशिक्षण\n• Google वर 'Excellent' रेटिंग: https://g.co/kgs/J7RW2B"
      hi: "🩺 *डॉ. अमोल लाहोटी*\nवेरिकोज़ वेन्स स्पेशलिस्ट और एंडोवैस्कुलर सर्जन\n• 9+ वर्षों का अनुभव, 1000+ मरीज़ों का इलाज\n• MBBS (नायर हॉस्पिटल, मुंबई), MD रेडियोलॉजी (नागपुर)\n• वैस्कुलर और इंटरवेंशनल रेडियोलॉजी (सायन हॉस्पिटल, मुंबई)\n• टाटा मेमोरियल हॉस्पिटल में केमोएम्बोलाइज़ेशन ट्रेनिंग\n• Google पर 'Excellent' रेटिंग: https://g.co/kgs/J7RW2B"
      en: "🩺 *Dr. Amol Lahoti*\nVaricose Veins Specialist & Endovascular Surgeon\n• 9+ years of experience, 1000+ patients treated\n• MBBS (Nair Hospital, Mumbai), MD Radiology (Nagpur)\n• Vascular & Interventional Radiology (Sion Hospital, Mumbai)\n• Chemoembolization training at Tata Memorial Hospital\n• Rated 'Excellent' on Google: https://g.co/kgs/J7RW2B"
    next: [book, videos, menu]
  videos:
    text:
      mr: "🎥 डॉ. लाहोटी सरांचे पायाच्या नसांच्या त्रासाबद्दल व उपचारांबद्दल व्हिडिओ:\nhttps://www.youtube.com/@healthylegsforhealthylifeb6496\nअधिक माहिती: https://dramollahoti.com"
      hi: "🎥 डॉ. लाहोटी के पैरों की नसों की तकलीफ़ और इलाज पर वीडियो:\nhttps://www.youtube.com/@healthylegsforhealthylifeb6496\nअधिक जानकारी: https://dramollahoti.com"
      en: "🎥 Dr. Lahoti's videos on leg vein problems and their treatment:\nhttps://www.youtube.com/@healthylegsforhealthylifeb6496\nMore information: https://dramollahoti.com"
    next: [book, call, menu]
  scheme:
    # ⚠️ [TO BE CONFIRMED BY CLINIC]: scheme names, which treatments are covered, and documents needed.
    text:
      mr: "🆓 *सरकारी योजनेअंतर्गत मोफत उपचार*\nपात्र रुग्णांसाठी व्हेरिकोज व्हेन्सचे *लेझर ऑपरेशन, ॲडमिशन व औषधे* सरकारी आरोग्य योजनेअंतर्गत *मोफत* होऊ शकतात. खिशातून पैसे भरावे लागत नाहीत.\n1️⃣ तपासणी + कलर डॉपलर\n2️⃣ डॉक्टरांनी सांगितल्यास डे-केअर लेझर उपचार (टाके नाहीत)\n3️⃣ योजनेची सर्व कागदपत्रे आमची टीम करते\n4️⃣ त्याच/दुसऱ्या दिवशी घरी\nतुमच्याकडे आयुष्मान भारत / MJPJAY कार्ड आहे का?"
      hi: "🆓 *सरकारी योजना के तहत मुफ़्त इलाज*\nपात्र मरीज़ों के लिए वेरिकोज़ वेन्स का *लेज़र ऑपरेशन, भर्ती और दवाइयां* सरकारी स्वास्थ्य योजना में *मुफ़्त* हो सकते हैं. जेब से पैसे नहीं लगते.\n1️⃣ जांच + कलर डॉप्लर\n2️⃣ डॉक्टर की सलाह पर डे-केयर लेज़र इलाज (टांके नहीं)\n3️⃣ योजना के सारे कागज़ात हमारी टीम करती है\n4️⃣ उसी/अगले दिन घर\nक्या आपके पास आयुष्मान भारत / MJPJAY कार्ड है?"
      en: "🆓 *Free treatment under government schemes*\nFor eligible patients, the varicose vein *laser procedure, admission and medicines* can be *free* under government health schemes, with nothing to pay from your pocket.\n1️⃣ Check-up + Colour Doppler\n2️⃣ If the doctor advises it: day-care laser treatment (no stitches)\n3️⃣ Our team handles all scheme paperwork\n4️⃣ Home the same or next day\nDo you have an Ayushman Bharat / MJPJAY card?"
    next: []
