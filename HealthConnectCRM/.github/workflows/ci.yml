name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, unit tests, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Dependency audit (high and above fail the build)
        run: npm audit --omit=dev --audit-level=high

  rls:
    name: RLS tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:rls
      - name: Generated DB types are up to date
        run: npm run db:types && git diff --exit-code lib/db/types.ts

  e2e:
    name: E2E (Supabase local + Playwright)
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: npm ci
      - run: supabase start
      - name: Export local Supabase credentials
        run: |
          supabase status -o env > .supabase.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' .supabase.env | cut -d= -f2- | tr -d '"')" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' .supabase.env | cut -d= -f2- | tr -d '"')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' .supabase.env | cut -d= -f2- | tr -d '"')" >> $GITHUB_ENV
          echo "MAILPIT_URL=$(grep -E '^(MAILPIT_URL|INBUCKET_URL)=' .supabase.env | head -1 | cut -d= -f2- | tr -d '"')" >> $GITHUB_ENV
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env: { E2E_SUPABASE: "1", CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  bot-evals:
    name: Bot evals (live model, ≥ 95 %)
    runs-on: ubuntu-latest
    # Runs when the prompt or bot code changes; needs the ANTHROPIC_API_KEY repo secret.
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Did the bot change?
        id: changed
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^(lib/ai/|tests/bot-evals/)'; then echo "run=true" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'true'
        with: { node-version: 22, cache: npm }
      - if: steps.changed.outputs.run == 'true'
        run: npm ci
      - if: steps.changed.outputs.run == 'true'
        run: npm run bot-evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.changed.outputs.run == 'true'
        with: { name: bot-eval-report, path: tests/bot-evals/report.json }
