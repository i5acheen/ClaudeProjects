# Predefined menu, answers and booking questions (Marathi / Hindi / English).
# Edit the text freely. Changes apply on the next message, with no restart needed.
# WhatsApp limits: list item title ≤ 24 characters, description ≤ 72, button title ≤ 20.
# Use ONLY facts from clinic_info.md. Anything not listed in this file goes to the AI.

welcome:
  mr: "नमस्कार 🙏 द व्हॅस्कुलर सेंटर, डॉ. अमोल लाहोटी (व्हेरिकोज व्हेन्स स्पेशालिस्ट) यांच्या क्लिनिकमध्ये आपलं स्वागत आहे.\n9+ वर्षांच्या अनुभवात सरांनी 1000+ रुग्णांवर उपचार केले आहेत."
  hi: "नमस्ते 🙏 द वैस्कुलर सेंटर, डॉ. अमोल लाहोटी (वेरिकोज़ वेन्स स्पेशलिस्ट) के क्लिनिक में आपका स्वागत है.\n9+ वर्षों के अनुभव में डॉक्टर साहब ने 1000+ मरीज़ों का इलाज किया है."
  en: "Hello 🙏 Welcome to The Vascular Center, the clinic of Dr. Amol Lahoti (Varicose Veins Specialist).\nIn 9+ years, Dr. Lahoti has treated 1000+ patients."

