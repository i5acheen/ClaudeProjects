# Fixed answers shown for menu items. `next` = buttons shown under the answer (max 3).
answers:
  treatment:
    text:
      mr: "*उपचार* 💉\n• तपासणी + कलर डॉपलर\n• गरज असल्यास डे-केअर लेझर उपचार: छोटे छिद्र, टाके नाहीत\n• बहुतेक रुग्ण त्याच किंवा दुसऱ्या दिवशी घरी जातात\n🆓 पात्र रुग्णांसाठी सरकारी योजनेत मोफत."
      hi: "*इलाज* 💉\n• जांच + कलर डॉप्लर\n• ज़रूरत हो तो डे-केयर लेज़र इलाज: छोटा छेद, टांके नहीं\n• ज़्यादातर मरीज़ उसी या अगले दिन घर जाते हैं\n🆓 पात्र मरीज़ों के लिए सरकारी योजना में मुफ़्त."
      en: "*Treatment* 💉\n• Check-up + Colour Doppler\n• If needed: day-care laser treatment, small puncture, no stitches\n• Most patients go home the same or next day\n🆓 Free for eligible patients under government schemes."
    next: [book, scheme, menu]
  cost:
    text:
      mr: "*खर्च* 💰\n• 🆓 पात्र रुग्णांसाठी सरकारी योजनेत उपचार मोफत\n• बहुतेक आरोग्य विमा पॉलिसींमध्ये कव्हर\n• अचूक खर्च तपासणीनंतर सांगितला जातो"
      hi: "*खर्च* 💰\n• 🆓 पात्र मरीज़ों के लिए सरकारी योजना में इलाज मुफ़्त\n• ज़्यादातर हेल्थ इंश्योरेंस में कवर\n• सही खर्च जांच के बाद बताया जाता है"
      en: "*Cost* 💰\n• 🆓 Free for eligible patients under government schemes\n• Usually covered by health insurance\n• The exact cost is shared after the check-up"
    next: [book, scheme, call]
  location:
    text:
      mr: "📍 {address}\n🗺️ {map_link}\n📞 {clinic_phone}"
      hi: "📍 {address}\n🗺️ {map_link}\n📞 {clinic_phone}"
      en: "📍 {address}\n🗺️ {map_link}\n📞 {clinic_phone}"
    next: [book, call, menu]
  scheme:
    # ⚠️ [TO BE CONFIRMED BY CLINIC]: scheme names, which treatments are covered, and documents needed.
    text:
      mr: "🆓 *सरकारी योजनेत मोफत उपचार*\nपात्र रुग्णांसाठी लेझर उपचार, ॲडमिशन व औषधे मोफत होऊ शकतात. योजनेची कागदपत्रे आमची टीम करते.\nतुमच्याकडे आयुष्मान भारत / MJPJAY कार्ड आहे का?"
      hi: "🆓 *सरकारी योजना में मुफ़्त इलाज*\nपात्र मरीज़ों के लिए लेज़र इलाज, भर्ती और दवाइयां मुफ़्त हो सकती हैं. योजना के कागज़ात हमारी टीम करती है.\nक्या आपके पास आयुष्मान भारत / MJPJAY कार्ड है?"
      en: "🆓 *Free treatment under government schemes*\nFor eligible patients, laser treatment, admission and medicines can be free. Our team handles the scheme paperwork.\nDo you have an Ayushman Bharat / MJPJAY card?"
    next: []
  other:
    text:
      mr: "नक्की 🙏 तुमचा प्रश्न टाइप करा."
      hi: "ज़रूर 🙏 अपना सवाल टाइप करें."
      en: "Sure 🙏 Please type your question."
    next: []

# Problems shown in the concern list. `label` is what the clinic sees in the lead sheet.
concerns:
  - id: varicose
    label: varicose veins
    title: {mr: "पायावर फुगलेल्या नसा", hi: "पैरों में उभरी नसें", en: "Varicose / bulging veins"}
    info:
      mr: "फुगलेल्या नसांकडे (व्हेरिकोज व्हेन्स) दुर्लक्ष केल्यास सूज, वेदना, त्वचेचा रंग बदलणे असे त्रास वाढू शकतात. वेळीच तपासणी केल्यास गुंतागुंत टाळता येते, आणि आधुनिक डे-केअर लेझर/ग्लू उपचार उपलब्ध आहेत."
      hi: "उभरी नसों (वेरिकोज़ वेन्स) को नज़रअंदाज़ करने से सूजन, दर्द, त्वचा का रंग बदलना जैसी तकलीफ़ें बढ़ सकती हैं. समय पर जांच से जटिलताएं टाली जा सकती हैं, और आधुनिक डे-केयर लेज़र/ग्लू इलाज उपलब्ध है."
      en: "If ignored, varicose veins can lead to more swelling, pain and skin colour changes. Early check-up helps avoid complications, and modern day-care laser/glue treatment is available."
  - id: swelling
    label: leg swelling
    title: {mr: "पायाला सूज", hi: "पैरों में सूजन", en: "Leg swelling"}
    info:
      mr: "पायाची सूज व्हेरिकोज व्हेन्स, DVT किंवा रक्तवाहिन्यांच्या इतर त्रासामुळे असू शकते. तपासणी व कलर डॉपलरने नेमके कारण समजते.\n⚠️ अचानक मोठी सूज, तीव्र वेदना किंवा श्वास घ्यायला त्रास असल्यास लगेच 108 वर कॉल करा."
      hi: "पैरों की सूजन वेरिकोज़ वेन्स, DVT या खून की नसों की किसी और तकलीफ़ से हो सकती है. जांच और कलर डॉप्लर से सही कारण पता चलता है.\n⚠️ अचानक बहुत सूजन, तेज़ दर्द या सांस लेने में तकलीफ़ हो तो तुरंत 108 पर कॉल करें."
      en: "Leg swelling can be due to varicose veins, DVT or other blood vessel problems. Examination and Colour Doppler show the exact cause.\n⚠️ Sudden severe swelling, strong pain or breathlessness: call 108 immediately."
  - id: pain
    label: leg pain
    title: {mr: "पाय दुखणे / जडपणा", hi: "पैर दर्द / भारीपन", en: "Leg pain / heaviness"}
    info:
      mr: "पाय दुखणे, जडपणा किंवा पेटके हे व्हेरिकोज व्हेन्स किंवा रक्तवाहिन्यांच्या त्रासाचे लक्षण असू शकते. क्लिनिकल तपासणी व कलर डॉपलरने कारण समजते."
      hi: "पैर दर्द, भारीपन या ऐंठन वेरिकोज़ वेन्स या खून की नसों की तकलीफ़ का लक्षण हो सकता है. क्लिनिकल जांच और कलर डॉप्लर से कारण पता चलता है."
      en: "Leg pain, heaviness or cramps can be a sign of varicose veins or a blood vessel problem. Clinical examination and Colour Doppler find the cause."
  - id: spider
    label: spider veins
    title: {mr: "बारीक जाळीदार नसा", hi: "बारीक जालीदार नसें", en: "Spider veins"}
    info:
      mr: "बारीक जाळीदार नसा (spider veins) नसांमधील वाढलेल्या दाबाचे लक्षण असू शकतात. तपासणीनंतर योग्य उपाय सुचवले जातात."
      hi: "बारीक जालीदार नसें (spider veins) नसों में बढ़े दबाव का लक्षण हो सकती हैं. जांच के बाद सही उपाय बताया जाता है."
      en: "Spider veins can be a sign of raised pressure in the veins. The right option is suggested after examination."
  - id: ulcer
    label: leg ulcer
    title: {mr: "पायावर न भरणारी जखम", hi: "पैर पर न भरने वाला घाव", en: "Non-healing leg wound"}
    info:
      mr: "न भरणारी जखम नसांच्या आजाराशी संबंधित असू शकते. उपचारासोबत नियमित जखमेची काळजी व जीवनशैलीतील बदल महत्त्वाचे आहेत. लवकर तपासणी करून घ्या."
      hi: "न भरने वाला घाव नसों की बीमारी से जुड़ा हो सकता है. इलाज के साथ नियमित घाव की देखभाल और जीवनशैली में बदलाव ज़रूरी हैं. जल्दी जांच करवाएं."
      en: "A non-healing wound can be linked to vein disease. Along with treatment, regular wound care and lifestyle changes matter. Please get checked early."
  - id: other
    label: other
    title: {mr: "दुसरा त्रास", hi: "कोई और तकलीफ़", en: "Other problem"}

durations:
  - {id: lt6m, label: "less than 6 months", title: {mr: "6 महिन्यांपेक्षा कमी", hi: "6 महीने से कम", en: "Under 6 months"}}
  - {id: 6m2y, label: "6 months - 2 years", title: {mr: "6 महिने – 2 वर्षे", hi: "6 महीने – 2 साल", en: "6 months – 2 years"}}
  - {id: gt2y, label: "more than 2 years", title: {mr: "2 वर्षांपेक्षा जास्त", hi: "2 साल से ज़्यादा", en: "Over 2 years"}}

times:
  - {id: today, label: "today", title: {mr: "आज", hi: "आज", en: "Today"}}
  - {id: tom_am, label: "tomorrow morning", title: {mr: "उद्या सकाळी", hi: "कल सुबह", en: "Tomorrow morning"}}
  - {id: tom_pm, label: "tomorrow evening", title: {mr: "उद्या संध्याकाळी", hi: "कल शाम", en: "Tomorrow evening"}}
  - {id: week, label: "this week", title: {mr: "या आठवड्यात", hi: "इस हफ़्ते", en: "This week"}}
  - {id: weekend, label: "weekend", title: {mr: "शनिवार / रविवार", hi: "शनिवार / रविवार", en: "Weekend"}}
  - {id: call_first, label: "call me first", title: {mr: "आधी कॉल करा", hi: "पहले कॉल करें", en: "Call me first"}}

# Appointment slots. ⚠️ [TO BE CONFIRMED BY CLINIC]: replace these example hours with the real OPD timings.
# If GOOGLE_CALENDAR_ID is set, busy times in that calendar are hidden and requests are added as tentative events.
schedule:
  timezone: Asia/Kolkata
  days_ahead: 7              # how many days ahead patients can choose
  open_days: [mon, tue, wed, thu, fri, sat]
  closed_dates: []           # e.g. ["2026-10-20", "2026-11-01"] for holidays
  slot_minutes: 30
  min_notice_minutes: 120    # earliest slot is at least 2 hours from now
  sessions:
    - id: am
      start: "10:00"
      end: "13:00"
      title: {mr: "🌅 सकाळ", hi: "🌅 सुबह", en: "🌅 Morning"}
    - id: pm
      start: "17:00"
      end: "20:00"
      title: {mr: "🌆 संध्याकाळ", hi: "🌆 शाम", en: "🌆 Evening"}

# Booking questions, asked one at a time (skipped if already known).
prompts:
