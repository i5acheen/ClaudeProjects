# Appointment slots. ⚠️ [TO BE CONFIRMED BY CLINIC]: replace these example hours with the real OPD timings.
# If GOOGLE_CALENDAR_ID is set, busy times in that calendar are hidden and requests are added as tentative events.
schedule:
  timezone: Asia/Kolkata
  days_ahead: 7              # how many days ahead patients can choose
  open_days: [mon, tue, wed, thu, fri, sat]
  closed_dates: []           # e.g. ["2026-10-20", "2026-11-01"] for holidays
  slot_minutes: 30
  min_notice_minutes: 120    # earliest slot is at least 2 hours from now
  sessions:
    - id: am
      start: "10:00"
      end: "13:00"
      title: {mr: "🌅 सकाळ", hi: "🌅 सुबह", en: "🌅 Morning"}
    - id: pm
      start: "17:00"
      end: "20:00"
      title: {mr: "🌆 संध्याकाळ", hi: "🌆 शाम", en: "🌆 Evening"}

# Booking questions, asked one at a time (skipped if already known).
prompts:
  concern: {mr: "तुम्हाला पायाचा कोणता त्रास होत आहे? 👇", hi: "आपको पैर में कौन सी तकलीफ़ है? 👇", en: "What problem are you facing? 👇"}
  concern_text: {mr: "थोडक्यात त्रास टाइप करा.", hi: "तकलीफ़ थोड़े में टाइप करें.", en: "Please type the problem in a few words."}
  duration: {mr: "हा त्रास किती काळापासून आहे?", hi: "यह तकलीफ़ कब से है?", en: "How long have you had this?"}
  name: {mr: "अपॉइंटमेंटसाठी कृपया रुग्णाचे *नाव* टाइप करा.", hi: "अपॉइंटमेंट के लिए कृपया मरीज़ का *नाम* टाइप करें.", en: "For the appointment, please type the patient's *name*."}
  city: {mr: "तुम्ही कोणत्या शहरातून / भागातून आहात?", hi: "आप किस शहर / इलाके से हैं?", en: "Which city / area are you from?"}
  preferred_time: {mr: "तुम्हाला कोणती वेळ सोयीची आहे? 👇", hi: "आपके लिए कौन सा समय सही रहेगा? 👇", en: "Which time suits you? 👇"}
  list_button: {mr: "निवडा", hi: "चुनें", en: "Choose"}
  date: {mr: "📅 तपासणीसाठी कोणता दिवस सोयीचा आहे? 👇", hi: "📅 जांच के लिए कौन सा दिन ठीक रहेगा? 👇", en: "📅 Which day suits you for the consultation? 👇"}
  date_button: {mr: "दिवस निवडा", hi: "दिन चुनें", en: "Choose day"}
  call_first: {mr: "📞 आधी कॉल करा", hi: "📞 पहले कॉल करें", en: "📞 Call me first"}
  session: {mr: "{day}: सकाळ की संध्याकाळ?", hi: "{day}: सुबह या शाम?", en: "{day}: morning or evening?"}
  slot: {mr: "{day}: कोणती वेळ? 👇", hi: "{day}: कौन सा समय? 👇", en: "{day}: which time? 👇"}
  slot_button: {mr: "वेळ निवडा", hi: "समय चुनें", en: "Choose time"}
  no_slots: {mr: "क्षमस्व, पुढील काही दिवसांत ऑनलाइन वेळ उपलब्ध नाही. आमची टीम तुम्हाला कॉल करून वेळ ठरवेल.", hi: "क्षमा करें, अगले कुछ दिनों में ऑनलाइन समय उपलब्ध नहीं है. हमारी टीम आपको कॉल करके समय तय करेगी.", en: "Sorry, no online slots are free in the next few days. Our team will call you to fix a time."}
  slot_taken: {mr: "क्षमस्व, ही वेळ नुकतीच बुक झाली. कृपया दुसरी वेळ निवडा.", hi: "क्षमा करें, यह समय अभी बुक हो गया. कृपया दूसरा समय चुनें.", en: "Sorry, that time was just taken. Please choose another."}
  requested: {mr: "📅 {slot} साठी तुमची विनंती क्लिनिकच्या कॅलेंडरमध्ये नोंदवली आहे.", hi: "📅 {slot} के लिए आपका अनुरोध क्लिनिक के कैलेंडर में दर्ज कर लिया गया है.", en: "📅 Your request for {slot} has been added to the clinic's calendar."}
  confirm_title: {mr: "कृपया तपशील तपासा ✅", hi: "कृपया जानकारी जांच लें ✅", en: "Please check the details ✅"}
  confirm_question: {mr: "हे बरोबर आहे का?", hi: "क्या यह सही है?", en: "Is this correct?"}
  fields:
    name: {mr: "नाव", hi: "नाम", en: "Name"}
    city: {mr: "शहर", hi: "शहर", en: "City"}
    concern: {mr: "त्रास", hi: "तकलीफ़", en: "Problem"}
    duration: {mr: "कालावधी", hi: "अवधि", en: "Since"}
    preferred_time: {mr: "सोयीची वेळ", hi: "सही समय", en: "Preferred time"}
  done: {mr: "धन्यवाद, {name}! 🙏\nआमची क्लिनिक टीम लवकरच तुम्हाला कॉल करून अपॉइंटमेंट निश्चित करेल.", hi: "धन्यवाद, {name}! 🙏\nहमारी क्लिनिक टीम जल्द ही आपको कॉल करके अपॉइंटमेंट पक्की करेगी.", en: "Thank you, {name}! 🙏\nOur clinic team will call you soon to confirm the appointment."}
  done_next: [location, videos, menu]
  # ⚠️ [TO BE CONFIRMED BY CLINIC]: documents patients should bring for the scheme.
  scheme_card: {mr: "छान! 👍 तपासणीला येताना योजनेचे कार्ड, आधार कार्ड व रेशन कार्ड सोबत आणा. आमची टीम योजनेची प्रक्रिया पूर्ण करण्यास मदत करेल.", hi: "बढ़िया! 👍 जांच के लिए आते समय योजना का कार्ड, आधार कार्ड और राशन कार्ड साथ लाएं. हमारी टीम योजना की प्रक्रिया में मदद करेगी.", en: "Great! 👍 Please bring your scheme card, Aadhaar card and ration card to the consultation. Our team will help complete the scheme process."}
  scheme_unknown: {mr: "काही हरकत नाही 🙏 आमची टीम तुमची पात्रता तपासेल. तपासणीला येताना आधार कार्ड व रेशन कार्ड सोबत आणा.", hi: "कोई बात नहीं 🙏 हमारी टीम आपकी पात्रता जांचेगी. जांच के लिए आते समय आधार कार्ड और राशन कार्ड साथ लाएं.", en: "No problem 🙏 Our team will check your eligibility. Please bring your Aadhaar card and ration card to the consultation."}
  # Used when no AI key is set: typed questions get this + the main menu ({phone} = CLINIC_PHONE).
  no_ai: {mr: "क्षमस्व 🙏 या प्रश्नाचे उत्तर इथे देता येत नाही. तुमचा प्रश्न नोंदवला आहे.\nकृपया खालील मेनूमधून पर्याय निवडा किंवा कॉल करा: {phone}", hi: "क्षमा करें 🙏 इस सवाल का जवाब यहां नहीं दिया जा सकता. आपका सवाल दर्ज कर लिया गया है.\nकृपया नीचे मेनू से विकल्प चुनें या कॉल करें: {phone}", en: "Sorry 🙏 we can't answer that here. Your question has been noted.\nPlease choose from the menu below, or call {phone}"}
  change: {mr: "ठीक आहे, तपशील पुन्हा भरूया.", hi: "ठीक है, जानकारी फिर से भरते हैं.", en: "Okay, let's fill in the details again."}

# Small buttons used under answers.
buttons:
  book: {mr: "📅 अपॉइंटमेंट", hi: "📅 अपॉइंटमेंट", en: "📅 Book"}
  location: {mr: "📍 पत्ता", hi: "📍 पता", en: "📍 Location"}
  videos: {mr: "🎥 व्हिडिओ", hi: "🎥 वीडियो", en: "🎥 Videos"}
  call: {mr: "📞 कॉल हवा", hi: "📞 कॉल करें", en: "📞 Call me"}
  cost: {mr: "💰 खर्च", hi: "💰 खर्च", en: "💰 Cost"}
  menu: {mr: "☰ मेनू", hi: "☰ मेनू", en: "☰ Menu"}
  scheme: {mr: "🆓 मोफत योजना", hi: "🆓 मुफ़्त योजना", en: "🆓 Free scheme"}
  scheme_card: {mr: "✅ कार्ड आहे", hi: "✅ कार्ड है", en: "✅ I have a card"}
  scheme_unknown: {mr: "❓ माहित नाही", hi: "❓ पता नहीं", en: "❓ Not sure"}
  confirm_yes: {mr: "✅ बरोबर आहे", hi: "✅ सही है", en: "✅ Correct"}
  confirm_change: {mr: "✏️ बदला", hi: "✏️ बदलें", en: "✏️ Change"}

# Gentle reminders if a patient stops replying (sent only inside WhatsApp's free 24-hour window,
# never after the patient confirmed a booking, and never while staff are chatting).
# Keep them honest: no invented deadlines or scarcity.
followups:
  - after_hours: 2
    text:
      mr: "नमस्कार{name} 🙏 तुमच्या पायाच्या त्रासाबद्दल अजून काही प्रश्न आहे का?\nपात्र रुग्णांसाठी लेझर ऑपरेशन सरकारी योजनेअंतर्गत मोफत होऊ शकते. तपासणीसाठी वेळ ठरवायची का?"
      hi: "नमस्ते{name} 🙏 पैरों की तकलीफ़ के बारे में कोई और सवाल है?\nपात्र मरीज़ों के लिए लेज़र ऑपरेशन सरकारी योजना में मुफ़्त हो सकता है. जांच का समय तय करें?"
      en: "Hello{name} 🙏 Any other questions about your leg problem?\nFor eligible patients, the laser procedure can be free under government schemes. Shall we fix a check-up time?"
    buttons: [book, scheme, call]
  - after_hours: 20
    text:
      mr: "{name_comma}फुगलेल्या नसांकडे दुर्लक्ष केल्यास सूज व वेदना वाढू शकतात. वेळीच तपासणी केल्यास गुंतागुंत टाळता येते. 🙏\nतुमच्यासाठी सोयीची वेळ ठरवूया का?"
      hi: "{name_comma}उभरी नसों को नज़रअंदाज़ करने से सूजन और दर्द बढ़ सकता है. समय पर जांच से जटिलताएं टाली जा सकती हैं. 🙏\nआपके लिए सही समय तय करें?"
      en: "{name_comma}If ignored, varicose veins can lead to more swelling and pain. An early check-up helps avoid complications. 🙏\nShall we fix a convenient time?"
    buttons: [book, call, menu]

# Adding other treatments later (e.g. piles, heart): add their problems to `concerns`, their facts to
# knowledge/clinic_info.md (with the treating doctor), a menu item, and whether the scheme covers them.
# Only add once the clinic confirms the doctor, treatment and scheme coverage.

# Emergency words: checked on every typed message, with or without AI. The reply goes out instantly.
emergency:
  keywords: ["श्वास घ्यायला", "श्वास लाग", "दम लाग", "छातीत दुख", "छातीत", "सांस लेने", "सांस फूल", "छाती में दर्द",
             "chest pain", "breathless", "can't breathe", "cant breathe", "shwas", "swas ghyayla", "saans",
             "बेशुद्ध", "बेहोश", "behosh", "beshuddh", "unconscious", "fainted", "रक्तस्त्राव", "खूप रक्त",
             "खून बह", "heavy bleeding", "bleeding", "khoon", "लकवा", "पक्षाघात", "paralysis", "stroke",
             "पाय काळा", "पाय निळा", "पैर काला", "पैर नीला", "foot black", "foot blue"]
  text:
    mr: "⚠️ हे गंभीर असू शकते. कृपया *लगेच 108 वर कॉल करा* किंवा जवळच्या हॉस्पिटलच्या इमर्जन्सी विभागात जा. उशीर करू नका.\nक्लिनिक: {phone}"
    hi: "⚠️ यह गंभीर हो सकता है. कृपया *तुरंत 108 पर कॉल करें* या नज़दीकी अस्पताल के इमरजेंसी विभाग में जाएं. देर न करें.\nक्लिनिक: {phone}"
    en: "⚠️ This could be serious. Please *call 108 immediately* or go to the nearest hospital emergency department. Don't wait.\nClinic: {phone}"
